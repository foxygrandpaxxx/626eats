name: Enrich Dish Descriptions

# Generates encyclopedic descriptions and regional tags for all dishes
# in the embedded DISHES array (index.html). Uses Claude Haiku — ~$0.30 total.
#
# Run once initially, then re-run when new dishes are added.
# Options:
#   missing_only: true  = only dishes without a description (default, safe to re-run)
#   missing_only: false = regenerate all descriptions
#
# Required secrets:
#   ANTHROPIC_API_KEY
on:
  workflow_dispatch:
    inputs:
      missing_only:
        description: 'Only enrich dishes missing descriptions (true = safe re-run)'
        required: false
        default: 'true'

jobs:
  enrich-dishes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dish enrichment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.missing_only }}" = "false" ]; then
            python scripts/enrich_dish_descriptions.py --all
          else
            python scripts/enrich_dish_descriptions.py
          fi

      - name: Commit and push updated index.html
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "626 Eats Bot"
          git add index.html
          git diff --staged --quiet || git commit -m "Dishes: add descriptions and region tags [$(date -u '+%Y-%m-%d')]"
          git push origin HEAD:main || echo "Nothing to push"
