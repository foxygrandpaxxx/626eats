name: Export Data

# Manually triggered from GitHub Actions tab
# Use this any time you want to refresh restaurants.json from the Sheet
# and push fresh photo URLs (with the real API key from secrets)
on:
  workflow_dispatch:
    inputs:
      fix_photos:
        description: 'Rewrite photo URLs with current API key'
        required: false
        default: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Export Sheet → restaurants.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/export_json.py

      - name: Rewrite photo URLs with current API key
        if: ${{ github.event.inputs.fix_photos != 'false' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, json, re
          from pathlib import Path

          key = os.environ.get("GOOGLE_API_KEY", "")
          if not key:
              print("GOOGLE_API_KEY not set — skipping photo URL rewrite")
              exit(0)

          path = Path("data/restaurants.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          rests = data.get("restaurants", [])

          fixed = 0
          for r in rests:
              photos = r.get("photos", {})
              for k, url in photos.items():
                  if url and "maps.googleapis.com" in url:
                      new_url = re.sub(r"key=[^&\s]+", "key=" + key, url)
                      if new_url != url:
                          photos[k] = new_url
                          fixed += 1

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Rewrote {fixed} photo URLs")
          PYEOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "626 Eats Bot"
          git add data/restaurants.json
          git diff --staged --quiet || git commit -m "Export: refresh data and photo URLs [$(date -u '+%Y-%m-%d')]"
          git push origin HEAD:main || echo "Nothing to push"
