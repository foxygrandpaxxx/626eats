name: Harvest Dishes

# For every restaurant, extracts a structured dish list using Claude Haiku:
#   • English name, Chinese characters, pinyin with tones
#   • isSignature flag (specifically praised dishes)
#   • Dish category (Noodles, Dumplings, Hot Pot, etc.)
#
# Requires refresh_places_data.py to have run first (data in columns BD-BG).
# Cost: ~$0.10 total with Haiku batching.
#
# Required secrets:
#   ANTHROPIC_API_KEY
#   GOOGLE_SERVICE_ACCOUNT_JSON
#   SPREADSHEET_ID

on:
  workflow_dispatch:
    inputs:
      force_harvest:
        description: 'Re-process restaurants that already have dish data (true/false)'
        required: false
        default: 'false'

jobs:
  harvest-dishes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Harvest dishes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FORCE_HARVEST: ${{ github.event.inputs.force_harvest }}
        run: python scripts/dish_harvest.py
