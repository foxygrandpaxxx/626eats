name: Press Sweep

# Search for press coverage (Eater LA, LA Times, Timeout, The Infatuation, etc.)
# Uses Claude's built-in web search tool — no separate search API key needed.
# Claude reads the full article text and extracts structured data directly.
#
# Cost: ~$0.50–$1.00 to sweep all 273 restaurants (Claude Haiku + web search).
# Re-run quarterly or after adding new restaurants.
#
# Required secrets:
#   ANTHROPIC_API_KEY            - Claude API key (web search + extraction)
#   GOOGLE_SERVICE_ACCOUNT_JSON  - for Sheets read/write
#   SPREADSHEET_ID               - Google Sheets ID
on:
  workflow_dispatch:
    inputs:
      restaurant:
        description: 'Sweep single restaurant (partial name match, leave blank for all)'
        required: false
        default: ''

jobs:
  press-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Run press sweep
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.restaurant }}" ]; then
            python scripts/press_sweep.py --restaurant "${{ github.event.inputs.restaurant }}"
          else
            python scripts/press_sweep.py
          fi

      - name: Export press data to press.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/export_press.py

      - name: Commit and push press.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "626 Eats Bot"
          git add data/press.json
          git diff --staged --quiet || git commit -m "Data: update press coverage [$(date -u '+%Y-%m-%d')]"
          git push origin HEAD:main || echo "Nothing to push"
