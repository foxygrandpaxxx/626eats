name: Press Sweep

# Search for press coverage (Eater LA, LA Times, Timeout, etc.) for all restaurants.
# Run manually to discover new press mentions. Uses Serper API (free trial: 2,500 queries).
# After sweep, exports press.json which the app loads to show press badges.
#
# Required secrets:
#   SERPER_API_KEY               - from serper.dev (free trial available)
#   ANTHROPIC_API_KEY            - Claude API key (for confirmation + extraction)
#   GOOGLE_SERVICE_ACCOUNT_JSON  - for Sheets read/write
#   SPREADSHEET_ID               - Google Sheets ID
on:
  workflow_dispatch:
    inputs:
      restaurant:
        description: 'Sweep single restaurant (partial name match, optional)'
        required: false
        default: ''

jobs:
  press-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run press sweep
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.restaurant }}" ]; then
            python scripts/press_sweep.py --restaurant "${{ github.event.inputs.restaurant }}"
          else
            python scripts/press_sweep.py
          fi

      - name: Export press data to press.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/export_press.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "626 Eats Bot"
          git add data/press.json
          git diff --staged --quiet || git commit -m "Data: update press coverage [$(date -u '+%Y-%m-%d')]"
          git push origin HEAD:main || echo "Nothing to push"
