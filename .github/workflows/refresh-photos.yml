name: Refresh Photo URLs

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Refresh URLs older than N days (default: 90)'
        required: false
        default: '90'
      dry_run:
        description: 'Dry run — preview without writing changes (true/false)'
        required: false
        default: 'false'

jobs:
  refresh-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Refresh photo URLs in Google Sheet
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '90' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/refresh_photos.py

      - name: Export JSON from Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/export_json.py

      - name: Commit and push updated restaurants.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "626 Eats Bot"
          git add data/restaurants.json
          git diff --staged --quiet || git commit -m "Manual: refresh photo URLs [$(date -u '+%Y-%m-%d')]"
          git push origin HEAD:main || echo "Nothing to push"
