name: Refresh Ratings

# Refresh Google + Yelp ratings and review counts for all restaurants.
# Run manually whenever you want fresh ratings, or quarterly.
# API costs: ~$0 (covered by Google $200/mo free credit + Yelp free tier).
on:
  workflow_dispatch:
    inputs:
      export_after:
        description: 'Run export_json.py after ratings update'
        required: false
        default: 'true'

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Refresh Google ratings
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/refresh_ratings.py

      - name: Export updated data to restaurants.json
        if: ${{ github.event.inputs.export_after != 'false' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/export_json.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "626 Eats Bot"
          git add data/restaurants.json
          git diff --staged --quiet || git commit -m "Data: refresh ratings [$(date -u '+%Y-%m-%d')]"
          git push origin HEAD:main || echo "Nothing to push"
